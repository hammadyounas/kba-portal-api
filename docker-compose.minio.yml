# Optional MinIO for private document storage
# Usage: docker compose -f docker-compose.minio.yml up -d
# Then set STORAGE_DRIVER=minio in .env

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: kbaadmin
      MINIO_ROOT_PASSWORD: kbaadminsecret
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 kbaadmin kbaadminsecret;
      mc mb -p local/kba-documents || true;
      mc anonymous set none local/kba-documents;
      exit 0;
      "

volumes:
  minio_data:
